version: "2"

linters:

  default: all

  disable:
    - wsl
    - wsl_v5
    - gomodguard
    - nlreturn
    - nonamedreturns
    - exhaustruct
    - varnamelen
    - wrapcheck
    - forbidigo
    - ireturn

    - mnd
    - gosec
    - revive
    - gochecknoglobals
    - errcheck
    - tagliatelle
    #- tagliatelle

  settings:

    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - go.etcd.io/bbolt
            - github.com/takanoriyanagitani/go-strings2bbolt
          deny:
            - pkg: unsafe

    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
      allow-no-explanation:
        - gochecknoglobals
        - funlen
        - ireturn
        - gocognit
        - cyclop
        - funlen

    govet:
      enable-all: true
      disable:
      - fieldalignment

    staticcheck:
      checks:
      - all
      - -ST1017
      - -ST1023
      - -QF1011
      - -QF1008
      - -ST1001
      - -ST1000
